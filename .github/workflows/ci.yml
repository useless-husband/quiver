name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # macos-latest: Apple Silicon (NEON + SDOT, F_FULLFSYNC);
        # ubuntu-24.04-arm: Linux AArch64 (NEON, runtime dotprod detection);
        # ubuntu-latest: x86-64 (AVX2 path).
        os: [macos-latest, ubuntu-24.04-arm, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --all-targets
      - run: cargo test --release
      - name: scalar kernels only
        run: cargo test --release --lib
        env:
          QUIVER_KERNELS: scalar
      - run: ./target/release/quiver version
      - run: cargo run --release --example library

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned so that lints added in later releases do not break the build.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
